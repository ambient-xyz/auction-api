name: Transaction parser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustfmt +1.98.1 --check --config skip_children=true src/lib.rs src/parser.rs tests/parser.rs
      - run: cargo +1.98.1 test --locked
      - run: cargo +1.98.1 test --locked --features parser
      - run: cargo +1.98.1 clippy --locked --all-targets --features parser
      - run: cargo +1.98.1 doc --locked --no-deps --features parser
